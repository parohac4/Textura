<!doctype html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Textura</title>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div class="pane-head">
          <button id="open-workspace" class="ghost" title="Otevřít složku s poznámkami">
            Workspace
          </button>
          <span class="spacer"></span>
          <button id="reload" class="ghost icon" title="Znovu načíst z disku">↻</button>
          <button id="settings" class="ghost icon" title="Nastavení">⚙</button>
        </div>

        <div class="pane-head toolbar">
          <button id="new-note" class="ghost" title="Nová poznámka (Ctrl+N)">
            + Poznámka
          </button>
          <button id="new-folder" class="ghost" title="Nová složka">+ Složka</button>
        </div>

        <input id="search" type="search" placeholder="Hledat v poznámkách…" autocomplete="off" />

        <div id="filter" hidden>
          <span id="filter-label"></span>
          <button id="filter-clear" title="Zrušit filtr (Esc)">×</button>
        </div>

        <div id="list" class="scroll"></div>

        <div class="pane-head sub">Tagy</div>
        <div id="tags" class="scroll tags"></div>
      </aside>

      <main id="main">
        <header id="note-head">
          <span id="note-title">Textura</span>
          <span id="note-path"></span>
          <span id="save-state"></span>
        </header>
        <div id="editor"></div>
        <footer id="status">
          Otevři složku s <code>.txt</code> poznámkami. Nová poznámka
          <kbd>Ctrl</kbd>+<kbd>N</kbd>, odkaz otevřeš <kbd>Ctrl</kbd>+<kbd>klik</kbd>,
          uložíš <kbd>Ctrl</kbd>+<kbd>S</kbd>.
        </footer>
      </main>

      <aside id="backlinks-pane">
        <div class="pane-head sub">Zpětné odkazy</div>
        <div id="backlinks" class="scroll"></div>
      </aside>
    </div>

    <menu id="context-menu" hidden></menu>

    <div id="modal" hidden>
      <div class="modal-box">
        <div id="modal-title"></div>
        <div id="modal-body"></div>
        <div class="modal-actions">
          <button id="modal-cancel" class="ghost">Zrušit</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
