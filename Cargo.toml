[workspace]
resolver = "2"
members = ["crates/textura-core", "crates/textura-app"]
# Jádro se musí dát testovat i tam, kde nejsou systémové knihovny pro Tauri
# (GTK/WebKit). `cargo test` proto staví jen textura-core; aplikace se staví
# explicitně přes `cargo tauri dev` / `-p textura-app`.
default-members = ["crates/textura-core"]

[workspace.package]
version = "0.5.0"
edition = "2021"
rust-version = "1.75"
license = "MIT"
repository = "https://github.com/parohac4/Textura"
